version: "3.8"

# VPN Platform services — run alongside the existing wg-easy stack.
# Start with:  docker compose -f docker-compose.platform.yml up -d
# The existing docker-compose.yml (wg-easy) should remain running separately.

services:

  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vpn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vpnplatform
      POSTGRES_USER: vpnuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vpn-platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnuser -d vpnplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vpn-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://vpnuser:${POSTGRES_PASSWORD:-changeme_strong_password}@postgres:5432/vpnplatform
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WGEASY_URL: ${WGEASY_URL:-http://3.21.126.65:51821}
      WGEASY_PASSWORD: ${WGEASY_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      VPN_SERVER_HOST: ${VPN_SERVER_HOST:-3.21.126.65}
      VPN_SERVER_PORT: ${VPN_SERVER_PORT:-51830}
      VPN_SERVER_NAME: ${VPN_SERVER_NAME:-US East}
      VPN_SERVER_COUNTRY: ${VPN_SERVER_COUNTRY:-United States}
      EXPIRY_CHECK_CRON: ${EXPIRY_CHECK_CRON:-0 0 * * *}
      EXPIRY_WARNING_DAYS: ${EXPIRY_WARNING_DAYS:-7}
    networks:
      - vpn-platform
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Database migration runner ─────────────────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vpn-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/migrations/run.js"]
    environment:
      DATABASE_URL: postgresql://vpnuser:${POSTGRES_PASSWORD:-changeme_strong_password}@postgres:5432/vpnplatform
      NODE_ENV: production
    networks:
      - vpn-platform

  # ─── Frontend PWA ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: ${VITE_WS_URL:-}
    container_name: vpn-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - vpn-platform
    ports:
      - "80:80"

  # ─── Nginx reverse proxy (optional — use if you want a single entry point) ─
  # Uncomment this section to route both frontend and API through port 443/80.
  #
  # nginx:
  #   image: nginx:alpine
  #   container_name: vpn-nginx
  #   restart: unless-stopped
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   depends_on:
  #     - frontend
  #     - backend
  #   networks:
  #     - vpn-platform

volumes:
  postgres_data:

networks:
  vpn-platform:
    driver: bridge
