version: "3.8"

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy
    container_name: wg-easy
    environment:
      - LANG=en
      - WG_HOST=3.21.126.65
      - WG_PORT=51830
      - PASSWORD_HASH=$2a$12$.2zo1m8erxnOL7K9o/rWXukNbynMTrkLBKIuv/a0ouuTXe41P0PHy
      - WG_DEFAULT_DNS=1.1.1.1
    volumes:
      - ./data:/etc/wireguard
    ports:
      - "51830:51830/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
